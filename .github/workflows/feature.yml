name: Terraform Validate
 
on:
  push:
    branches:
      - 'feature/**'
 
permissions:
  id-token: write
  contents: read
 
jobs:
  validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 

      # ------------------------------------------------------
      # CONFIGURE GITHUB AUTHENTICATION
      # ------------------------------------------------------
      # Configures Git authentication for accessing private
      # Terraform modules hosted in GitHub repositories.
      #
      # GH_PAT is used for private repository access.
      # ------------------------------------------------------

      - name: Configure GitHub Authentication
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf \
            "https://github.com/"


      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
 
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
 
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=environment/test/backend.tfvars
 
      - name: Terraform Validate
        run: terraform validate


