name: Terraform Validate

on:
  push:
    branches:
      - "feature/**"

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VAR_windows_import_password: ${{ secrets.WINDOWS_IMPORT_PASSWORD }}

jobs:
  validate:
    name: Validate Infrastructure Code
    runs-on: ubuntu-latest

    environment: test

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Terraform Version
        id: terraform_version
        run: |
          echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform_version.outputs.version }}

      - name: Validate Environment Files
        run: |
          test -f environment/test/backend.tfvars
          test -f environment/test/test.tfvars

      - name: Configure GitHub Authentication
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Terraform Init
        run: |
          terraform init \
            -backend=false \
            -input=false

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform validate